# Security: static analysis, dependency auditing, Helm validation, and
# vulnerability scanning. Runs on every PR and weekly; image scans run
# weekly/on-demand only (they build every image first, which is slow).
name: security

on:
  pull_request:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

# Default to read-only. Only trivy-fs escalates (security-events: write, at
# the job level) to publish SARIF to the Security tab; nothing else needs
# more than repo read (#112).
permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install bandit==1.9.4
      - name: bandit static analysis
        # Excludes test suites: they are full of bare `assert`, which is
        # exactly right in a test and is all B101 would report. Now that
        # per-service tests live under services/*/tests (issue #113), not
        # excluding them buries real findings under ~170 B101 lines.
        run: bandit -r services scripts mkdocs_hooks.py --exclude '*/tests/*'

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install all service dependencies
        # Audits the dependency tree the services actually ship, not the
        # test toolchain (requirements-test.txt is dev-only). setuptools is
        # upgraded first -- the version pip's own bootstrap leaves behind
        # flags PYSEC-2026-3447 and would fail the audit on a non-service
        # package.
        run: |
          pip install pip-audit==2.10.1
          pip install -U "setuptools>=83.0.0"
          pip install --no-deps \
            -e services/common -e services/ingestion-api \
            -e services/ingestion-worker -e services/orchestration-mcp \
            -e services/reranker-service
          # mcp held <2.0: 2.0.0 removed/renamed mcp.server.fastmcp (#205).
          pip install \
            "pydantic>=2.7" "PyJWT>=2.8" "cryptography>=42.0" "sqlmodel>=0.0.21" \
            "psycopg[binary]>=3.1" "qdrant-client>=1.10" "pymilvus>=2.5" "fastembed>=0.6" \
            "boto3>=1.34" "nats-py>=2.7" \
            "fastapi>=0.115" "uvicorn[standard]>=0.30" "httpx>=0.27" \
            "pypdf>=6.14.2" "python-docx>=1.1" "python-pptx>=1.0" \
            "openpyxl>=3.1" "beautifulsoup4>=4.12" \
            "mcp>=2.0,<3.0" "sentence-transformers>=3.0" \
            "opentelemetry-api>=1.30" "opentelemetry-sdk>=1.30" "opentelemetry-exporter-otlp-proto-http>=1.30" \
            "opentelemetry-instrumentation-fastapi>=0.51b0" "opentelemetry-instrumentation-httpx>=0.51b0" \
            "pyroscope-io>=1.2"
      - name: Audit for known vulnerabilities
        run: pip-audit --skip-editable

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint helm/nexus-rag
      - name: helm template renders
        # oidcRedirectUri must be set explicitly when no ingress host is
        # configured -- the chart fails closed on this by design.
        run: >
          helm template helm/nexus-rag --debug
          --set ingestionApi.oidcRedirectUri=https://rag.ci.example/auth/callback
          > /dev/null
      # Issue #257. ci/lint-values.yaml is not an example to copy -- it is the
      # widest render (every component enabled, every optional block
      # populated), so a template that only breaks under some combination of
      # flags breaks the build instead of a deployment. It also supplies the
      # two values this chart fails closed on, for the same reason the
      # nexus-rag step above supplies oidcRedirectUri: the defaults publish
      # four unauthenticated services on LoadBalancer addresses and there is
      # no safe default for "who may reach them".
      - name: helm lint (observability)
        run: helm lint helm/observability --values helm/observability/ci/lint-values.yaml
      - name: helm template renders (observability)
        run: >
          helm template helm/observability --debug
          --values helm/observability/ci/lint-values.yaml
          > /dev/null
      - name: Observability chart fails closed without source ranges
        # Asserts the guard rail actually fires. A fail-closed default that
        # quietly stopped working would render an open Prometheus and pass CI.
        run: |
          if helm template helm/observability > /dev/null 2>&1; then
            echo "::error::helm/observability rendered with no loadBalancerSourceRanges set" >&2
            exit 1
          fi
          echo "Chart correctly refuses to render an unrestricted LoadBalancer."
      - name: nexus-rag chart fails closed without an OIDC redirect URI
        # The mirror of the check above for the other chart that fails closed.
        # Rendering with no oidcRedirectUri and no ingress host must not
        # succeed: the OIDC login callback cannot be derived, and guessing one
        # produces a deployment whose login silently redirects nowhere.
        run: |
          if helm template helm/nexus-rag > /dev/null 2>&1; then
            echo "::error::helm/nexus-rag rendered with no oidcRedirectUri and no ingress host" >&2
            exit 1
          fi
          echo "Chart correctly refuses to render without an OIDC redirect URI."
      - name: Install kubeconform
        # helm lint checks chart grammar, not Kubernetes API validity: it will
        # happily pass a manifest with a misspelled field or a wrong apiVersion,
        # which then fails at `kubectl apply` time in a cluster. kubeconform
        # validates each rendered manifest against the real k8s JSON schemas,
        # offline, which is the part CI was missing.
        #
        # Pinned by version AND verified by SHA-256, not just fetched: this is a
        # binary being installed into a CI job that renders the deployment
        # manifests, and NFR-16's discipline (no floating references, nothing
        # trusted purely because a URL returned 200) applies to the toolchain as
        # much as to the images. A checksum mismatch fails the job rather than
        # silently running whatever was served.
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      # `-ignore-missing-schemas` is load-bearing and its output needs reading with
      # care: the ServiceMonitor combination reports `Skipped: 3` because
      # ServiceMonitor is a Prometheus-Operator CRD with no core-Kubernetes
      # schema to check against. Skipped means "not validated", not "valid" --
      # core resources in the same render are still strictly checked, and a
      # misspelled field in a core object still fails the build.
      #
      # Issue: the chart README states outright that CI "does not exercise every
      # value combination this chart supports (e.g. vectorBackend: milvus, or any
      # of the external blocks) -- render locally with the combination you're
      # about to deploy before trusting it." That caveat is the gap this matrix
      # closes. Every combination below is one the chart documents as supported;
      # each is rendered AND schema-validated, so a template that only breaks
      # under one flag combination breaks the build instead of a deployment.
      - name: helm render matrix (every documented value combination)
        run: |
          set -uo pipefail
          # An array, not an unquoted string: relying on word-splitting to turn
          # one variable into two argv entries works in bash but breaks silently
          # under any shell that does not split, and hides the intent either way.
          OIDC=(--set "ingestionApi.oidcRedirectUri=https://rag.ci.example/auth/callback")
          failed=0
          render() {
            name="$1"; shift
            if ! helm template helm/nexus-rag "${OIDC[@]}" "$@" >"/tmp/render.yaml" 2>"/tmp/render.err"; then
              echo "::error::render failed for combination: $name"
              sed -n '1,12p' /tmp/render.err >&2
              failed=1
              return
            fi
            if ! kubeconform -strict -summary -ignore-missing-schemas /tmp/render.yaml; then
              echo "::error::rendered manifests are not valid Kubernetes for: $name"
              kubeconform -strict -ignore-missing-schemas /tmp/render.yaml 2>&1 | head -20 >&2
              failed=1
              return
            fi
            echo "  [ok] $name ($(grep -c '^kind:' /tmp/render.yaml) resources)"
          }

          render "default (qdrant)"
          render "vectorBackend=milvus" --set vectorBackend=milvus
          render "external qdrant" \
            --set qdrant.enabled=false --set qdrant.external.host=qdrant.example
          render "external nats" \
            --set nats.enabled=false --set nats.external.host=nats.example
          render "external embedding" \
            --set embeddingService.enabled=false --set embeddingService.external.host=embed.example
          render "bundled object store" --set objectStore.enabled=true
          render "external reranker (tei)" \
            --set rerankerService.enabled=false \
            --set rerankerService.external.host=tei.example \
            --set rerankerService.external.apiCompatibility=tei
          render "serviceMonitor enabled" --set observability.serviceMonitor.enabled=true
          render "ingress enabled" \
            --set ingestionApi.ingress.enabled=true --set ingestionApi.ingress.host=rag.example

          if [ "$failed" != "0" ]; then
            echo "::error::one or more chart value combinations failed to render or validate" >&2
            exit 1
          fi
          echo "All documented value combinations render and validate."
      - name: Schema-validate the observability chart's widest render
        run: |
          helm template helm/observability \
            --values helm/observability/ci/lint-values.yaml > /tmp/obs.yaml
          kubeconform -strict -summary -ignore-missing-schemas /tmp/obs.yaml
      - name: Backends are mutually exclusive (issue #401 regression guard)
        # #401 fixed `vectorBackend: milvus` also deploying a Qdrant
        # StatefulSet and demanding its Secret. Nothing asserted it, so the
        # next refactor could quietly reintroduce provisioning both stores --
        # which in a classified deployment means chunk payloads sitting in a
        # second store nobody accounted for.
        run: |
          set -uo pipefail
          OIDC=(--set "ingestionApi.oidcRedirectUri=https://rag.ci.example/auth/callback")
          helm template helm/nexus-rag "${OIDC[@]}" --set vectorBackend=milvus > /tmp/milvus.yaml
          if grep -qE 'kind: StatefulSet' /tmp/milvus.yaml && grep -q 'nexus-rag-qdrant' /tmp/milvus.yaml; then
            echo "::error::vectorBackend=milvus still renders Qdrant resources (#401 regression)" >&2
            grep -n 'nexus-rag-qdrant' /tmp/milvus.yaml | head >&2
            exit 1
          fi
          grep -q 'MILVUS_URL' /tmp/milvus.yaml || {
            echo "::error::vectorBackend=milvus rendered no MILVUS_URL" >&2; exit 1; }
          echo "milvus mode renders Milvus only, with MILVUS_URL wired."

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read the repo, and write code scanning results. This is the only job in
    # the file that needs more than `contents: read` -- it uploads SARIF so
    # filesystem findings land in the Security tab, not just the run log.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One scan, two outcomes: trivy writes the SARIF report first, then
      # applies exit-code, so a HIGH/CRITICAL both fails the gate here AND
      # leaves a report for the upload below (which runs on always()).
      #
      # limit-severities-for-sarif is required here (issue #555): the
      # action's entrypoint unsets TRIVY_SEVERITY whenever format=sarif
      # unless this is set, so `severity: HIGH,CRITICAL` below was silently
      # ignored -- both the SARIF content AND the exit-code gate ran against
      # every severity, meaning any newly-disclosed LOW/MEDIUM finding could
      # red this gate.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: 1
      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build service images
        run: >
          docker compose build
          ingestion-api ingestion-worker orchestration-mcp reranker-service
      # Scan each built image with the same SHA-pinned trivy-action the
      # filesystem scan uses, instead of `docker run aquasec/trivy:latest`.
      # That `:latest` was a floating tag (the very thing pin-check/NFR-16
      # forbids in the shipped images); reusing the action keeps trivy on one
      # pinned supply-chain surface and drops the docker-socket mount.
      - name: Scan ingestion-api image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nexus-rag-ingestion-api
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan ingestion-worker image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nexus-rag-ingestion-worker
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan orchestration-mcp image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nexus-rag-orchestration-mcp
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan reranker-service image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nexus-rag-reranker-service
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  secret-scan:
    # Catch committed credentials before they reach main. gitleaks scans the
    # working tree on push/schedule; on a PR it needs full history so it can
    # diff the PR's commits (fetch-depth: 0). Fails the job on any finding.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # No org licence required for a public repo; this keeps the action
          # from probing for one. GITHUB_TOKEN lets it annotate the PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    # Generate a CycloneDX SBOM per shipped image and keep it as a build
    # artifact, so what actually went into each image is auditable after the
    # fact. Non-PR only: it builds every image first (like trivy-image).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build service images
        run: >
          docker compose build
          ingestion-api ingestion-worker orchestration-mcp reranker-service
      - run: mkdir -p sbom
      - name: SBOM for ingestion-api
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nexus-rag-ingestion-api
          format: cyclonedx-json
          output-file: sbom/ingestion-api.cdx.json
          upload-artifact: false
      - name: SBOM for ingestion-worker
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nexus-rag-ingestion-worker
          format: cyclonedx-json
          output-file: sbom/ingestion-worker.cdx.json
          upload-artifact: false
      - name: SBOM for orchestration-mcp
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nexus-rag-orchestration-mcp
          format: cyclonedx-json
          output-file: sbom/orchestration-mcp.cdx.json
          upload-artifact: false
      - name: SBOM for reranker-service
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nexus-rag-reranker-service
          format: cyclonedx-json
          output-file: sbom/reranker-service.cdx.json
          upload-artifact: false
      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
