global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: nexus-rag-ingestion-api
    static_configs:
      - targets: ["ingestion-api:8001"]

  - job_name: nexus-rag-ingestion-worker
    static_configs:
      - targets: ["ingestion-worker:8004"]

  - job_name: nexus-rag-orchestration-mcp
    static_configs:
      - targets: ["orchestration-mcp:8002"]

  - job_name: nexus-rag-reranker
    static_configs:
      - targets: ["reranker-service:8003"]

  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: qdrant
    # Qdrant protects /metrics when API-key auth is enabled. Prometheus does
    # not expand arbitrary environment variables in scrape credentials, so
    # this local-development config follows docker-compose.yml's documented
    # default read-only key. If that key is changed, update this credential
    # (or render the config from the environment) at the same time.
    authorization:
      credentials: dev-qdrant-readonly-key
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
